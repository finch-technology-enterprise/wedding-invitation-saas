name: CI

on:
  pull_request:
  push:
    branches: [production]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare local test configuration
        run: |
          cp wrangler.jsonc.example wrangler.jsonc
          perl -0pi -e 's/"DEPLOYMENT_MODE": "self_hosted"/"DEPLOYMENT_MODE": "hosted"/' wrangler.jsonc
          perl -0pi -e 's/"database_name": "invite-platform"/"database_name": "invite"/' wrangler.jsonc
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare local test configuration
        run: |
          cp wrangler.jsonc.example wrangler.jsonc
          perl -0pi -e 's/"DEPLOYMENT_MODE": "self_hosted"/"DEPLOYMENT_MODE": "hosted"/' wrangler.jsonc
          perl -0pi -e 's/"database_name": "invite-platform"/"database_name": "invite"/' wrangler.jsonc
      - run: npx wrangler d1 migrations apply invite --local
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test -c playwright.admin.config.ts
        env:
          CI: true
