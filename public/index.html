<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="李天豪与刘蔼蕴的婚礼邀请函 · 2027.10.09" />
  <title>婚礼邀请函 | 李天豪 ❤ 刘蔼蕴</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500&display=swap"
  />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/canvas.css" />
  <link rel="stylesheet" href="css/scenes.css" />
</head>
<body>

  <audio id="bgm" loop preload="none"></audio>

  <!-- The cinematic window. #stage is translated by the timeline. -->
  <div id="viewport">
    <main id="stage" aria-label="婚礼邀请函"></main>

    <!-- Music control lives inside the canvas so it stays pinned to the
         invitation's corner rather than the browser window. -->
    <button id="music-toggle" type="button" aria-pressed="false" aria-label="播放背景音乐">
      <svg class="music__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z" />
      </svg>
      <span class="music__strike" aria-hidden="true"></span>
    </button>
  </div>

  <!-- Screen-reader / assistive announcements for async form state. -->
  <p id="live-region" class="visually-hidden" role="status" aria-live="polite"></p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
