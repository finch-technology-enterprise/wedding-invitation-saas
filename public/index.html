<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <!-- Filled from content.js at boot so the date has one source of truth. -->
  <meta name="description" content="婚礼邀请函" />
  <title>婚礼邀请函 | 李天豪 ❤ 刘蔼蕴</title>

  <!-- Inline 囍 seal, so the tab icon costs no request and cannot 404. -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23fff' stroke='%23b00808'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23b00808' font-family='serif'%3E%E5%9B%8D%3C/text%3E%3C/svg%3E"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Latin faces are small and load here. The Chinese faces are requested by
    js/fonts.js with a `text=` parameter built from the actual copy, because
    Google splits CJK into ~100 unicode-range subsets and the browser would
    otherwise fetch dozens of them. See js/fonts.js.
  -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap"
  />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/canvas.css" />
  <link rel="stylesheet" href="css/scenes.css" />
</head>
<body>

  <audio id="bgm" loop preload="none"></audio>

  <!-- The cinematic window. #stage is translated by the timeline. -->
  <div id="viewport">
    <main id="stage" aria-label="婚礼邀请函"></main>

    <!-- Music control lives inside the canvas so it stays pinned to the
         invitation's corner rather than the browser window. -->
    <button id="music-toggle" type="button" aria-pressed="false" aria-label="播放背景音乐">
      <svg class="music__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z" />
      </svg>
      <span class="music__strike" aria-hidden="true"></span>
    </button>
  </div>

  <!-- Screen-reader / assistive announcements for async form state. -->
  <p id="live-region" class="visually-hidden" role="status" aria-live="polite"></p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
